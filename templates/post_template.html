<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>{{POST_TITLE}} | Fletcher Christian KC</title>
  <meta name="description" content="{{POST_EXCERPT_ATTR}}" />
  <meta name="theme-color" content="#0b0712" />

  <link rel="canonical" href="{{POST_URL}}" />
  <link rel="icon" type="image/jpeg" href="https://bafybeihqeeb3l7wuz6gfzfd4hhs2exdm2qob72rbxgqeg2renwmyznzshe.ipfs.dweb.link?filename=allseeingeye.JPG" />
  <link rel="apple-touch-icon" href="https://bafybeihqeeb3l7wuz6gfzfd4hhs2exdm2qob72rbxgqeg2renwmyznzshe.ipfs.dweb.link?filename=allseeingeye.JPG" />

  <meta property="og:type" content="article" />
  <meta property="og:site_name" content="Rants in Person" />
  <meta property="og:title" content="{{POST_TITLE}} | Fletcher Christian KC" />
  <meta property="og:description" content="{{POST_EXCERPT_ATTR}}" />
  <meta property="og:url" content="{{POST_URL}}" />
  <meta property="og:image" content="{{POST_IMAGE}}" />
  <meta property="og:image:secure_url" content="{{POST_IMAGE}}" />
  <meta property="og:image:alt" content="{{POST_TITLE}}" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{POST_TITLE}} | Fletcher Christian KC" />
  <meta name="twitter:description" content="{{POST_EXCERPT_ATTR}}" />
  <meta name="twitter:image" content="{{POST_IMAGE}}" />
  <meta name="twitter:image:alt" content="{{POST_TITLE}}" />

  <style>
    :root{
      --bg:#07050b;
      --bg-2:#120a1b;
      --panel:#130f19;
      --panel-2:#171220;
      --text:#f4efe8;
      --muted:#aca3b8;
      --line:rgba(255,255,255,.09);
      --line-strong:rgba(255,255,255,.16);
      --accent:#e7d9ff;
      --accent-2:#7c4dff;
      --glow-1:rgba(124,77,255,.18);
      --glow-2:rgba(178,108,255,.12);
      --shadow:0 24px 70px rgba(0,0,0,.48);
      --radius:24px;
      --max:1240px;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      color:var(--text);
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height:1.55;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
      background:
        radial-gradient(circle at 15% 20%, rgba(116,64,255,.14), transparent 28%),
        radial-gradient(circle at 82% 12%, rgba(165,84,255,.10), transparent 24%),
        radial-gradient(circle at 50% 65%, rgba(78,26,120,.10), transparent 34%),
        linear-gradient(180deg, #050409 0%, #0b0712 38%, #09070f 100%);
      background-attachment:fixed;
    }

    a{color:inherit;text-decoration:none}
    img,video{max-width:100%;display:block}
    button{font:inherit}

    .wrap{
      width:min(calc(100% - 32px), var(--max));
      margin:0 auto;
    }

    .site-header{
      position:sticky;
      top:0;
      z-index:20;
      backdrop-filter:blur(16px);
      background:rgba(9,7,15,.6);
      border-bottom:1px solid rgba(255,255,255,.06);
    }

    .nav{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      min-height:72px;
    }

    .brand{
      display:flex;
      flex-direction:column;
      gap:2px;
      min-width:0;
    }

    .brand-title{
      font-family:Georgia, "Times New Roman", serif;
      font-size:1.25rem;
      letter-spacing:.02em;
    }

    .brand-sub{
      color:var(--muted);
      font-size:.84rem;
    }

    .nav-links{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }

    .pill-link,
    .text-link{
      border-radius:999px;
      transition:.2s ease;
    }

    .pill-link{
      padding:.7rem 1rem;
      border:1px solid var(--line);
      background:rgba(255,255,255,.035);
      box-shadow:0 0 0 1px rgba(124,77,255,.05) inset;
    }

    .pill-link:hover{
      border-color:var(--line-strong);
      background:rgba(255,255,255,.06);
      transform:translateY(-1px);
    }

    .text-link{
      padding:.55rem .2rem;
      color:var(--muted);
    }

    .text-link:hover{color:var(--text)}

    .hero{
      padding:26px 0 18px;
    }

    .hero-shell{
      position:relative;
      overflow:hidden;
      border-radius:30px;
      border:1px solid var(--line);
      min-height:360px;
      background:#000;
      box-shadow:var(--shadow);
      isolation:isolate;
    }

    .hero-shell::before{
      content:"";
      position:absolute;
      inset:0;
      background-image:url("{{POST_IMAGE}}");
      background-size:cover;
      background-position:center;
      filter:brightness(.42) saturate(.96);
      transform:scale(1.02);
    }

    .hero-shell::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(180deg, rgba(8,6,12,.20) 0%, rgba(17,8,28,.56) 68%, rgba(6,4,10,.86) 100%),
        linear-gradient(90deg, rgba(8,6,12,.70) 0%, rgba(54,22,92,.14) 58%, rgba(8,6,12,.52) 100%);
    }

    .hero-inner{
      position:relative;
      z-index:1;
      min-height:360px;
      display:flex;
      align-items:end;
      padding:32px;
    }

    .hero-copy{
      width:min(100%, 820px);
    }

    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:10px;
      margin-bottom:14px;
      color:var(--accent);
      font-size:.88rem;
      letter-spacing:.08em;
      text-transform:uppercase;
    }

    .eyebrow::before{
      content:"";
      display:block;
      width:34px;
      height:1px;
      background:currentColor;
      opacity:.8;
    }

    h1{
      margin:0 0 10px;
      font-family:Georgia, "Times New Roman", serif;
      font-size:clamp(2.3rem, 6vw, 4.3rem);
      line-height:.96;
      letter-spacing:-.03em;
    }

    .hero-copy p{
      margin:0;
      color:rgba(244,239,232,.82);
      max-width:58ch;
    }

    .content-wrap{
      padding:16px 0 64px;
    }

    .panel{
      position:relative;
      background:
        linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.018)),
        linear-gradient(180deg, rgba(124,77,255,.06), rgba(124,77,255,.02));
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .panel::before{
      content:"";
      position:absolute;
      inset:-1px;
      background:
        radial-gradient(circle at top left, var(--glow-1), transparent 30%),
        radial-gradient(circle at bottom right, var(--glow-2), transparent 28%);
      pointer-events:none;
      z-index:0;
    }

    .panel > *{
      position:relative;
      z-index:1;
    }

    .article{
      padding:22px 24px 28px;
    }

    .article-meta{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      color:var(--muted);
      font-size:.88rem;
      margin-bottom:18px;
    }

    .dot{
      width:4px;
      height:4px;
      border-radius:50%;
      background:rgba(255,255,255,.28);
    }

    .tag-row{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin:18px 0 0;
    }

    .tag{
      padding:.42rem .72rem;
      border-radius:999px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.03);
      color:var(--muted);
      font-size:.82rem;
    }

    .post-body{
      margin-top:22px;
      color:rgba(244,239,232,.92);
      max-width:760px;
      font-size:1.06rem;
      line-height:1.78;
    }

    .post-body p:first-child{margin-top:0}
    .post-body p:last-child{margin-bottom:0}
    .post-body p{margin:0 0 1rem}

    .post-body h2,
    .post-body h3{
      margin:2rem 0 1rem;
      font-family:Georgia, "Times New Roman", serif;
      letter-spacing:-.02em;
    }

    .post-body ul{
      margin:0 0 0 1.2rem;
      padding:0;
    }

    .post-body li{
      margin:0 0 .9rem;
    }

    .post-body a{
      text-decoration:underline;
      text-underline-offset:2px;
    }

    .post-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:22px;
    }

    .share-button{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:.72rem .95rem;
      border-radius:999px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.04);
      color:var(--text);
      cursor:pointer;
      transition:.2s ease;
    }

    .share-button:hover{
      transform:translateY(-1px);
      border-color:var(--line-strong);
      background:rgba(124,77,255,.14);
    }

    .site-footer{
      border-top:1px solid rgba(255,255,255,.08);
      padding:26px 0 42px;
    }

    .footer-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      flex-wrap:wrap;
      color:var(--muted);
      font-size:.92rem;
    }

    .footer-links{
      display:flex;
      align-items:center;
      gap:16px;
      flex-wrap:wrap;
    }

    .footer-links a:hover{
      color:var(--text);
    }

    @media (max-width: 640px){
      .wrap{
        width:min(calc(100% - 20px), var(--max));
      }

      .nav{
        min-height:64px;
        align-items:flex-start;
        padding:14px 0;
        flex-direction:column;
      }

      .hero-inner{
        min-height:300px;
        padding:22px;
      }

      .hero-shell{
        min-height:300px;
        border-radius:24px;
      }

      .article{
        padding-left:18px;
        padding-right:18px;
      }

      .nav-links,
      .footer-links{
        width:100%;
      }
    }
  </style>

  <script type="application/ld+json">
  {
    "@context":"https://schema.org",
    "@type":"Article",
    "headline":"{{POST_TITLE_JSON}}",
    "description":"{{POST_EXCERPT_JSON}}",
    "datePublished":"{{POST_DATE}}",
    "author":{
      "@type":"Person",
      "name":"{{POST_AUTHOR_JSON}}"
    },
    "image":["{{POST_IMAGE}}"],
    "mainEntityOfPage":"{{POST_URL}}",
    "publisher":{
      "@type":"Organization",
      "name":"Jam Killer Productions LLC",
      "url":"https://jamkillerproductions.io"
    }
  }
  </script>
</head>
<body>
  <header class="site-header">
    <div class="wrap nav">
      <a class="brand" href="../index.html" aria-label="Rants in Person home">
        <span class="brand-title">Rants in Person</span>
        <span class="brand-sub">Fletcher Christian KC</span>
      </a>

      <nav class="nav-links" aria-label="Primary">
        <a class="text-link" href="../index.html">Home</a>
        <a class="pill-link" href="../archive.html">Archive</a>
        <a class="pill-link" href="https://themutinyreport.com" target="_blank" rel="noopener">Get Updates</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="wrap">
        <div class="hero-shell">
          <div class="hero-inner">
            <div class="hero-copy">
              <div class="eyebrow">Fletcher Christian KC</div>
              <h1>{{POST_TITLE}}</h1>
              <p>{{POST_EXCERPT}}</p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="wrap content-wrap">
      <article class="panel article">
        <div class="article-meta">
          <span>{{POST_AUTHOR}}</span>
          <span class="dot" aria-hidden="true"></span>
          <time datetime="{{POST_DATE}}">{{POST_DATE_DISPLAY}}</time>
        </div>

        <div class="tag-row">
          {{POST_TAGS}}
        </div>

        <div class="post-body">
          {{POST_CONTENT}}
        </div>

        <div class="post-actions">
          <button class="share-button" type="button" data-share-url="{{POST_URL}}" data-share-title="{{POST_TITLE_ATTR}}" data-share-text="{{POST_EXCERPT_ATTR}}">Share</button>
          <a class="share-button" href="../archive.html">Archive</a>
        </div>
      </article>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-row">
      <div>© <span id="year"></span> Fletcher Christian KC. All rights reserved.</div>
      <div class="footer-links">
        <a href="https://jamkillerproductions.io" target="_blank" rel="noopener">A Jam Killer Joint</a>
        <a href="https://mutinyreport.com" target="_blank" rel="noopener">Get Updates</a>
      </div>
    </div>
  </footer>

  <script>
    (() => {
      const year = document.getElementById('year');
      if (year) year.textContent = new Date().getFullYear();

      document.addEventListener('click', async (event) => {
        const button = event.target.closest('.share-button');
        if (!button || !button.dataset.shareUrl) return;

        const url = button.dataset.shareUrl;
        const title = button.dataset.shareTitle || document.title;
        const text = button.dataset.shareText || '';

        try {
          if (navigator.share) {
            await navigator.share({ title, text, url });
          } else {
            await navigator.clipboard.writeText(url);
            const original = button.textContent;
            button.textContent = 'Link Copied';
            setTimeout(() => {
              button.textContent = original;
            }, 1800);
          }
        } catch (error) {
          console.error('Share failed:', error);
        }
      });
    })();
  </script>
</body>
</html>
